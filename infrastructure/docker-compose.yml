services:
  postgres:
    image: postgres:16-alpine
    container_name: rentora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentora
      POSTGRES_PASSWORD: rentora_dev
      POSTGRES_DB: rentora
    ports:
      - "5432:5432"
    volumes:
      - rentora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentora -d rentora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rentora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rentora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rentora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rentora_minio
      MINIO_ROOT_PASSWORD: rentora_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rentora_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rentora_pg_data:
  rentora_redis_data:
  rentora_minio_data:
